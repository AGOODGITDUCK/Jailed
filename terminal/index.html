<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nerfed Terminal</title>
  <link rel="stylesheet" href="https://unpkg.com/xterm/css/xterm.css" />
  <script src="https://unpkg.com/xterm/lib/xterm.js"></script>
  <style>
    body { margin: 0; height: 100vh; }
    #terminal { height: 100%; width: 100%; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    const term = new Terminal();
    term.open(document.getElementById('terminal'));
    term.write('Welcome to Nerfed Terminal\r\n> ');

    term.onKey(e => {
      if(e.domEvent.key === 'Enter') {
        // simple command parser example
        const command = term._core.buffer.active.getLine(term._core.buffer.active.baseY).translateToString(true).trim();
        if(command === 'help') term.writeln('\r\nAvailable commands: help, ls, cat <file>');
        else if(command === 'ls') term.writeln('\r\nfile1.txt  file2.txt');
        else term.writeln(`\r\nUnknown command: ${command}`);
        term.write('\r\n> ');
      }
    });
  </script>
</body>
</html>
