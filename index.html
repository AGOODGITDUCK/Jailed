<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jailed Access</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0a0a, #1c1c1c);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      margin: 0;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 0.5em;
      color: #00b4ff;
    }
    p {
      color: #ccc;
      margin-bottom: 2em;
    }
    .button {
      display: inline-block;
      margin: 10px;
      padding: 14px 28px;
      background: #00b4ff;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .button:hover {
      background: #0094d1;
    }
    .banner {
      background: #ffcc00;
      color: #000;
      font-weight: bold;
      padding: 10px;
      width: 100%;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1000;
    }
    .container {
      margin-top: 60px; /* to push content below the banner */
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- Reminder banner -->
  <div class="banner">
    ⚠️ Reminder: You need to install the Jailed Terminal profile to use this app fully.
  </div>

  <div class="container">
    <h1>Jailed Access</h1>
    <p>Welcome! Choose a tool below:</p>

    <a class="button" href="/customization_hub_v1_0.mobileconfig">Download Profile</a>
    <a class="button" href="/terminal/index.html">Terminal</a>
  </div>

</body>
</html>
