<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Jailed Access</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0a0a, #1c1c1c);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      text-align: center;

      border-radius: 12px;

    .banner {
      background: #333333cc;
      color: #ffcc00;
      font-weight: bold;

      width: 100%;
      text-align: center;
      position: fixed;
      top: 0;

      z-index: 1000;

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }
    a.info-link {
